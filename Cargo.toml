[package]
name = "zend-opcodes"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["string"] }
num-bigint = "0.4"
p4spectec = { path = "../p4-spectec/p4spectec/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
stacker = "0.1"
zmij = "1"

[dev-dependencies]
tempfile = "3"
